name: Build Android APKs (Kid & Parent)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kid-apk:
    name: Build Kid App APK (vyra_k)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x vyra_k/gradlew

      - name: Build Kid Release APK
        working-directory: vyra_k
        run: ./gradlew assembleRelease -x lint --stacktrace

      - name: Upload Kid APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyra-child-apk
          path: vyra_k/app/build/outputs/apk/release/*.apk
          retention-days: 1

  build-parent-apk:
    name: Build Parent App APK (vyra_p)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Grant Execute Permission to Flutter gradlew
        run: chmod +x vyra_p/android/gradlew || true

      - name: Install Dependencies
        working-directory: vyra_p
        run: flutter pub get

      - name: Build Parent Release APK
        working-directory: vyra_p
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Parent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyra-parent-apk
          path: vyra_p/build/app/outputs/flutter-apk/*.apk
          retention-days: 1

  publish-github-release:
    name: Publish Release with APKs
    needs: [build-kid-apk, build-parent-apk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Kid APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: vyra-child-apk
          path: downloaded_apks/child

      - name: Download Parent APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vyra-parent-apk
          path: downloaded_apks/parent

      - name: Prepare Named APKs
        run: |
          mkdir -p release_assets
          # Copy child release APK
          find downloaded_apks/child/ -name "*.apk" -exec cp {} release_assets/vyra-child.apk \;
          # Copy parent release APK
          find downloaded_apks/parent/ -name "*.apk" -exec cp {} release_assets/vyra-parent.apk \;
          echo "Release Assets prepared:"
          ls -lh release_assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-build.${{ github.run_number }}"
          name: "Vyra APKs — Build #${{ github.run_number }}"
          make_latest: true
          body: |
            ### 🚀 Vyra Build #${{ github.run_number }}
            Commit: `${{ github.sha }}`

            | APK | Description |
            |---|---|
            | 📱 **`vyra-child.apk`** | Child App (System Toolkit) — बच्चे के phone mein install करो |
            | 👨‍👩‍👧 **`vyra-parent.apk`** | Parent Dashboard — Apne phone mein install करो |

            *Neeche **Assets** section se download karo.*
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
