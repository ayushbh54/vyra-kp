name: Build Android APKs (Kid & Parent)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kid-apk:
    name: Build Kid App APK (vyra_k)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x vyra_k/gradlew

      - name: Build Kid APKs (Debug & Release)
        working-directory: vyra_k
        run: ./gradlew assembleDebug assembleRelease -x lint --stacktrace

      - name: Upload Kid APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vyra-child-apks
          path: |
            vyra_k/app/build/outputs/apk/debug/*.apk
            vyra_k/app/build/outputs/apk/release/*.apk
          retention-days: 14

  build-parent-apk:
    name: Build Parent App APK (vyra_p)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Grant Execute Permission to Flutter gradlew
        run: chmod +x vyra_p/android/gradlew || true

      - name: Install Dependencies
        working-directory: vyra_p
        run: flutter pub get

      - name: Build Parent Release APK
        working-directory: vyra_p
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Parent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyra-parent-apk
          path: vyra_p/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  publish-github-release:
    name: Publish Release with APKs
    needs: [build-kid-apk, build-parent-apk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download Kid APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vyra-child-apks
          path: downloaded_apks/child

      - name: Download Parent APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: vyra-parent-apk
          path: downloaded_apks/parent

      - name: Prepare Named APKs
        run: |
          mkdir -p release_assets
          # Find and copy child debug & release APKs safely
          find downloaded_apks/child/ -name "*debug*.apk" -exec cp {} release_assets/vyra-child-debug.apk \;
          find downloaded_apks/child/ -name "*release*.apk" -exec cp {} release_assets/vyra-child-release.apk \;
          # Find and copy parent release APK safely
          find downloaded_apks/parent/ -name "*.apk" -exec cp {} release_assets/vyra-parent-release.apk \;
          echo "Release Assets prepared:"
          ls -lh release_assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-build.${{ github.run_number }}"
          name: "Vyra Android APKs — Build #${{ github.run_number }}"
          make_latest: true
          body: |
            ### 🚀 Automated GitHub Actions Build #${{ github.run_number }}
            Direct APK downloads built from commit `${{ github.sha }}`:

            | APK File | Description | Recommended Usage |
            |---|---|---|
            | 📱 **`vyra-child-debug.apk`** | Child Stealth App (System Toolkit) | **Fast testing & direct phone install** (no signature restrictions) |
            | 🛡️ **`vyra-child-release.apk`** | Child Stealth App Release | Production child device deployment |
            | 👨‍👩‍👧 **`vyra-parent-release.apk`** | Parent Dashboard (Flutter) | Parent monitoring dashboard |

            *Click any file below under **Assets** to download directly to your Android device.*
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
