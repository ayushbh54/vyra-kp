name: Build Android APKs (Kid, Parent & WhatsApp Viewer)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Grant Execute Permission to gradlew
        run: |
          chmod +x vyra_k/gradlew
          chmod +x vyra_p/android/gradlew || true
          chmod +x whatsapp_chat_viewer/android/gradlew || true

      - name: Build Kid Release APK
        working-directory: vyra_k
        run: ./gradlew assembleRelease -x lint --stacktrace

      - name: Build Parent Release APK
        working-directory: vyra_p
        run: |
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Build WhatsApp Chat Viewer Release APK
        working-directory: whatsapp_chat_viewer
        run: |
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          # Copy child release APK (both names for compatibility)
          find vyra_k/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release_assets/vyra-child.apk \;
          cp release_assets/vyra-child.apk release_assets/child-app.apk
          # Copy parent release APK
          find vyra_p/build/app/outputs/flutter-apk/ -name "*.apk" -exec cp {} release_assets/vyra-parent.apk \;
          # Copy WhatsApp viewer release APK
          find whatsapp_chat_viewer/build/app/outputs/flutter-apk/ -name "*.apk" -exec cp {} release_assets/whatsapp-chat-viewer.apk \;
          echo "Release Assets prepared:"
          ls -lh release_assets/

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-build.${{ github.run_number }}"
          name: "Vyra APKs — Build #${{ github.run_number }}"
          make_latest: true
          body: |
            ### 🚀 Vyra Build #${{ github.run_number }}
            Commit: `${{ github.sha }}`

            | APK | Description |
            |---|---|
            | 📱 **`vyra-child.apk`** | Child App (System Toolkit) — बच्चे के phone mein install करो |
            | 👨‍👩‍👧 **`vyra-parent.apk`** | Parent Dashboard — Apne phone mein install करो |
            | 💬 **`whatsapp-chat-viewer.apk`** | Standalone WhatsApp Chat & Deleted Messages Viewer (com.whatsapp + key) |

            *Neeche **Assets** section se download karo.*
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
